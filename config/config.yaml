defradb:
  url: "localhost:9181"
  keyring_secret: "pingpong"
  p2p:
    enabled: true
    bootstrap_peers:
      - '/ip4/35.254.135.221/tcp/9171/p2p/12D3KooWDUdHSCXBM5Wb7te6ZdWMgqddw7tJ7npWSzXK5tQgBsbT' # IND1
      - '/ip4/34.57.239.57/tcp/9171/p2p/12D3KooWBAgCEJHYqzuCFEXzjsw2CnV9JqvqMgTKYDww58aCxwW5' # IND2
      - '/ip4/34.134.119.63/tcp/9171/p2p/12D3KooWQQTuSQaz4HfuvnJHakkQy3PhWbKBBbS3RkmBw4ZsFkyT' # IND3
    listen_addr: "/ip4/0.0.0.0/tcp/9171"
    max_retries: 5                  # Number of connection attempts before marking peer as failed
    retry_base_delay_ms: 1000       # Base delay for exponential backoff (1s, 2s, 4s, 8s, 16s)
    reconnect_interval_ms: 60000    # Check for disconnected peers every 60 seconds
    enable_auto_reconnect: true     # Automatically reconnect to failed/disconnected peers
  store:
    path: "./.defra"
    # Badger memory configuration
    block_cache_mb: 256  # Small test host: cap the Badger block cache
    memtable_mb: 32      # Small test host: reduce in-memory write buffering
    index_cache_mb: 128  # Small test host: cap the Badger index cache
    # Badger compaction configuration
    num_compactors: 2              # Number of compaction workers
    # num_level_zero_tables: 20      # L0 tables before compaction starts
    # num_level_zero_tables_stall: 40  # L0 tables that trigger write stalls
    # Badger value log configuration
    value_log_file_size_mb: 128     # Size of each vlog file (smaller = faster GC)
shinzo:
  minimum_attestations: 1
  start_height: 0 # Indexer auto-detects from chain tip
  hub_base_url: testnet.shinzo.network:26657
  # P2P Control Settings
  wait_for_gaps: true         # Wait for gap processing before starting P2P
  max_gap_size: 1000          # Skip P2P if gap is larger than this
  # Queue Settings
  cache_queue_size: 10000        # Job queue size for document processing
  # View Management Settings
  view_inactivity_timeout: "24h"  # Stop updating views after 24h of no access
  view_cleanup_interval: "1h"     # Check for inactive views every hour
  view_worker_count: 4             # Workers for batch lens transformations
  view_queue_size: 1000            # Queue size for batch processing jobs
  batch_processing_enabled: true     # Enable batch processing for efficiency
  batch_max_views_per_job: 50         # Split large batches to prevent memory issues
  batch_query_cache_size: 250         # Cache query templates for reuse
  # Attestation Processing Settings
  batch_writer_count: 2             # Number of batch writers
  batch_size: 100                    # Max attestations per batch
  batch_flush_interval: 100          # Flush interval in milliseconds
  use_block_signatures: true
  doc_worker_count: 8
  doc_queue_size: 10000
  # Event Replication Filter
  # Controls which P2P documents the host stores. Blocks and BlockSignatures
  # always pass through regardless of filter settings.
  event_filter:
    enabled: true
    # Mode: "allowlist" (default) - only accept documents matching a group.
    #        "blocklist"          - accept everything EXCEPT documents matching a group.
    mode: "allowlist"
    # When true, a contract filter with types: ["transaction"] also applies to
    # logs and access-list entries from the same address. Set to false for
    # strict per-type matching only.
    cascade_filters: false
    # Optional block range gate (omit to accept all blocks):
    # block_range:
    #   min_block: 20000000
    #   max_block: 0              # 0 = no upper limit
    #
    # Filter groups - each group bundles related contracts and topics.
    # In allowlist mode a document must match at least one enabled group.
    # In blocklist mode a document is rejected if it matches any enabled group.
    groups:
      - name: "ethereum-mainnet-usdc"
        enabled: true
        contracts:
          - name: "USDC (Circle)"
            address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            types: ["log"]
pruner:
  enabled: true             # Set to true to enable automatic pruning
  # The event-queue pruner uses max_blocks * docs_per_block as its retained
  # document budget. 250 * 100 keeps at most ~25k replicated source docs.
  max_blocks: 250
  docs_per_block: 100
  interval_seconds: 30      # How often to check and prune
  prune_history: true       # Also remove pruned docs' DAG history so the test disk stays bounded.
schema:
  indexer_schema_endpoint: /api/v1/schema
  http_client_timeout_secs: 30
  # ⚠ auth_token is NOT configurable in this file (the field uses yaml:"-").
  # You MUST set the token via the INDEXER_SCHEMA_ENDPOINT_AUTH_TOKEN environment variable.
  # Example: INDEXER_SCHEMA_ENDPOINT_AUTH_TOKEN=my-secret-token
logger:
  development: true
  level: "info"
host:
  lens_registry_path: "./.defra/lens"
  health_server_port: 8080
  open_browser_on_start: false
  # Snapshot Bootstrap - download historical data from an indexer on first startup.
  # Set enabled: false to skip snapshot import entirely.
  snapshot:
    enabled: false
    indexer_url: "http://35.206.105.60:8080"
