networks:
  shinzo-net:
    driver: bridge

services:
  shinzo-host:
    image: ghcr.io/shinzonetwork/shinzo-host-client:v0.6.5-ethereum-mainnet
    platform: linux/amd64
    mem_reservation: 15g
    restart: unless-stopped
    container_name: shinzo-host
    # A signal during startup is only serviced once startup finishes, so this has to cover
    # startup as well as the shutdown timeout, or the process is killed mid-shutdown.
    stop_grace_period: 90s
    networks:
      - shinzo-net
    ports:
      - "443:9181"  # DefraDB API (internal network access)
      - "444:9182"  # GraphQL Playground 
      - "9171:9171"  # P2P networking (still needs external access)
    # volumes:
    #   - ./data/defradb:/app/.defra
    #   - ./data/lens:/app/.lens
    #   - ./config.yaml:/app/config.yaml:ro
    environment:
      - DEFRA_URL=0.0.0.0:9181
      - LOG_LEVEL=error
      - LOG_SOURCE=false
      - LOG_STACKTRACE=false

      # Metrics (off unless OTEL_METRICS_EXPORTER is set)
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 120s

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - shinzo-host
    networks:
      - shinzo-net
    restart: unless-stopped