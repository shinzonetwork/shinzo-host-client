networks:
  shinzo-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

services:
  shinzo-host:
    image: ghcr.io/shinzonetwork/shinzo-host-client:ethereum-mainnet-latest
    user: "1001:1001" # update to match your user and group id.
    mem_limit: 16g
    mem_reservation: 13g
    restart: unless-stopped
    container_name: shinzo-host
    networks:
      - shinzo-net
    ports:
      - "8443:9181"  # DefraDB API (internal network access)
      - "8444:9182"  # GraphQL Playground
      - "9171:9171"  # P2P networking (still needs external access)
      - "8080:8080" # Health + status routes
    volumes:
      - ./data/defradb:/app/.defra
      - ./data/keys:/app/.defra/keys
      - ./data/lens:/app/.defra/lens
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - DEFRA_URL=0.0.0.0:9181
      - GOMEMLIMIT=14GiB
      - LOG_LEVEL=info
      - LOG_SOURCE=false
      - LOG_STACKTRACE=false
      - ALLOWED_ORIGINS=https://*.shinzo.network
      - LIBP2P_TCP_REUSEPORT=false

      # Metrics (off unless OTEL_METRICS_EXPORTER is set)
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 120s