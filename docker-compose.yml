services:
  shinzo-host:
    build: .
    image: shinzo-host-client:latest
    container_name: shinzo-host
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "8080:8080"
      - "9171:9171"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - shinzo-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  shinzo-data:
