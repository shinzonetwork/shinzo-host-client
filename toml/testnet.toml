# A working testnet config, with real peers and a real snapshot indexer
# filled in. For a fully-documented, fill-in-the-blanks template, see
# toml/default.toml.
#
# Usage: bin/host start --config toml/testnet.toml

[node]
name = "default"
data_dir = ""
key_dir = ""
keyring_password = "shinzo-host"

[http]
addr = ":8080"

[p2p]
enabled = true
listen_addr = "/ip4/0.0.0.0/tcp/9171"
bootstrap_peers = [
  "/ip4/35.254.135.221/tcp/9171/p2p/12D3KooWDUdHSCXBM5Wb7te6ZdWMgqddw7tJ7npWSzXK5tQgBsbT", # IND1
  "/ip4/34.57.239.57/tcp/9171/p2p/12D3KooWBAgCEJHYqzuCFEXzjsw2CnV9JqvqMgTKYDww58aCxwW5",   # IND2
  "/ip4/34.134.119.63/tcp/9171/p2p/12D3KooWQQTuSQaz4HfuvnJHakkQy3PhWbKBBbS3RkmBw4ZsFkyT",  # IND3
]
max_retries = 5
retry_base_delay_ms = 500
reconnect_interval_ms = 5000
enable_auto_reconnect = true
peer_discovery_timeout_ms = 10000

[store]
path = ""
block_cache_mb = 512
memtable_mb = 64
index_cache_mb = 256
num_compactors = 4
num_level_zero_tables = 0
num_level_zero_tables_stall = 0
value_log_file_size_mb = 128

[shinzo]
hub_base_url = "testnet.shinzo.network"
chain_id = 0
minimum_attestations = 1
start_height = 0
payout_address = ""
view_inactivity_timeout = "24h"
view_cleanup_interval = "1h"
view_worker_count = 2
view_queue_size = 1000
cache_queue_size = 1000
batch_writer_count = 0
batch_size = 0
batch_flush_interval = 0
max_concurrent_verifications = 0
use_block_signatures = false
doc_worker_count = 32
doc_queue_size = 50000

[schema]
indexer_schema_endpoint = "/api/v1/schema"
http_client_timeout_secs = 30

[logger]
development = false
level = "info"

[playground]
enabled = true

[snapshot]
# fast-sync historical data from an indexer on first startup.
enabled = false
indexer_url = "http://35.254.135.221:8080"
historical_ranges = [
  { start = 24528700, end = 24528999 },
]

[event_filter]
enabled = false
mode = "allowlist"
cascade_filters = true
file = "filters.json"

[acp]
enabled = false
min_query_balance = ""
epoch_length = 0
as_base_url = ""
attester_window = ""

[pruner]
enabled = false
max_blocks = 10000
docs_per_block = 1000
interval_seconds = 60
prune_history = false
