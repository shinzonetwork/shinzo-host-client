<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shinzo Host</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<main>
  <h1>Shinzo Host &middot; Node Console</h1>
  <dl>
    <dt>Node ID</dt><dd id="node-id">loading&hellip;</dd>
    <dt>Peer ID</dt><dd id="peer-id">loading&hellip;</dd>
    <dt>DID</dt><dd id="did">loading&hellip;</dd>
  </dl>

  <h2>Resources</h2>
  <div class="charts">
    <div class="chart-block" id="disk-block">
      <div class="pie" id="disk-pie"></div>
      <p class="chart-title">Disk</p>
      <ul class="legend" id="disk-legend"></ul>
    </div>
    <div class="chart-block" id="memory-block">
      <div class="pie" id="memory-pie"></div>
      <p class="chart-title">Memory</p>
      <ul class="legend" id="memory-legend"></ul>
    </div>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
