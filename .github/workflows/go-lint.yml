# This workflow will run 'go test' on the project when creating a PR (or trying to push to) main
name: Go Lint CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Get CPU count
      id: cpu
      run: echo "count=$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" >> $GITHUB_OUTPUT
    
    - name: Linting - golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

    # Collection names come from pkg/chain. pkg/schema is left out because its schema checks
    # name the Ethereum types.
    - name: No hardcoded chain prefix
      run: |
        if git grep -n 'Ethereum__Mainnet' -- '*.go' ':!*_test.go' ':!pkg/chain/' ':!pkg/schema/'; then
          echo "Use the names from pkg/chain instead of a hardcoded chain prefix."
          exit 1
        fi
