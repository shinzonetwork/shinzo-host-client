# shinzo-host config. See hostconfig/config.go for the authoritative shape.
# Run: dist/shinzo-host start --config dist/config.toml

[node]
name = "default"
# data_dir, key_dir default to XDG_DATA_HOME/shinzo-host/<name> (or
# ~/.local/share/... ) when left empty, so this points at the same instance
# already on disk from earlier runs. Set them to fork off a separate instance.
data_dir = ""
key_dir = ""
# unlocks the node's identity keyring under key_dir.
keyring_password = "shinzo-host"

[http]
# serves /health, /metrics, /api/node, /console, /graphql, /playground.
addr = ":8080"

[p2p]
enabled = true
listen_addr = "/ip4/0.0.0.0/tcp/9171"
# dialed by MaintainPeerConnections, never at node startup.
bootstrap_peers = [
  "/ip4/35.254.135.221/tcp/9171/p2p/12D3KooWDUdHSCXBM5Wb7te6ZdWMgqddw7tJ7npWSzXK5tQgBsbT", # IND1
  "/ip4/34.57.239.57/tcp/9171/p2p/12D3KooWBAgCEJHYqzuCFEXzjsw2CnV9JqvqMgTKYDww58aCxwW5",   # IND2
  "/ip4/34.134.119.63/tcp/9171/p2p/12D3KooWQQTuSQaz4HfuvnJHakkQy3PhWbKBBbS3RkmBw4ZsFkyT",  # IND3
]
max_retries = 5                  # connection attempts before a peer is marked failed
retry_base_delay_ms = 500        # exponential backoff base (500ms, 1s, 2s, 4s, 8s)
reconnect_interval_ms = 5000     # how often to check for disconnected peers
enable_auto_reconnect = true
peer_discovery_timeout_ms = 10000

[store]
path = "" # defaults to <data_dir>/data
# Badger tuning. Only value_log_file_size_mb is wired into the node today
# (pkg/host/defra_start.go); the rest are reserved for when the others are.
block_cache_mb = 512
memtable_mb = 64
index_cache_mb = 256
num_compactors = 4
num_level_zero_tables = 0        # 0 = Badger's own default
num_level_zero_tables_stall = 0  # 0 = Badger's own default
value_log_file_size_mb = 128

[shinzo]
hub_base_url = "testnet.shinzo.network"
chain_id = 0 # set to the target network's EVM chain id; required once acp is enabled
minimum_attestations = 1
start_height = 0 # 0 = indexer auto-detects from chain tip
payout_address = "" # defaults to the operator key's own address when empty

# reserved for the view manager port, not yet wired into the new architecture.
view_inactivity_timeout = "24h"
view_cleanup_interval = "1h"
view_worker_count = 2
view_queue_size = 1000

# reserved, not yet consumed by anything in the new architecture.
cache_queue_size = 1000
batch_writer_count = 0
batch_size = 0
batch_flush_interval = 0
max_concurrent_verifications = 0
use_block_signatures = false # legacy toggle from the old processing pipeline; AttestSignatures always runs

doc_worker_count = 32   # AttestSignatures worker pool size, 0 falls back to a built-in default
doc_queue_size = 50000  # AttestSignatures queue depth, 0 falls back to a built-in default

[schema]
indexer_schema_endpoint = "/api/v1/schema"
http_client_timeout_secs = 30
# auth_token is not settable here, only via SHINZO_HOST_SCHEMA_AUTH_TOKEN.

[logger]
development = false
level = "info"

[playground]
enabled = true

[snapshot]
# fast-sync historical data from an indexer on first startup.
enabled = false
indexer_url = "http://35.254.135.221:8080"
historical_ranges = [
  { start = 24528700, end = 24528999 },
]

[event_filter]
# controls which P2P-replicated documents the host stores. Blocks and
# BlockSignatures always pass through regardless of this setting.
enabled = false
mode = "allowlist"     # "allowlist": only accept documents matching a group in file
                        # "blocklist": accept everything except documents matching a group
cascade_filters = true # a contract filter with types = ["transaction"] also applies to
                        # that address's logs and access-list entries when true
file = "filters.json"  # relative to the instance dir unless absolute; groups live there, not here

[acp]
# query-billing gate. Left disabled: blocked on the accounting service, not built yet.
enabled = false
min_query_balance = ""
epoch_length = 0
as_base_url = ""
attester_window = ""
